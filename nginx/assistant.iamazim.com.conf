server {
    listen 80;
    listen [::]:80;
    server_name assistant.iamazim.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # ── Internal-only: OpenCode API (opencode-serve, host systemd, 127.0.0.1:8091) ──
    # Reachable only from inside the Docker networks assistant-backend runs on —
    # never from the public internet. Do not remove the allow/deny lines.
    location /opencode-internal/ {
        allow 172.25.0.0/16;
        allow 172.20.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ── Internal-only: Hermes runner (hermes-runner.service, host, 127.0.0.1:8093) ──
    location /hermes-internal/ {
        allow 172.25.0.0/16;
        allow 172.20.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 200s;
    }

    # ── Internal-only: fazle-core ops bridge (2026-08-12) ──
    # fazle-core.service intentionally binds 127.0.0.1:8200 only (security
    # posture, see fazle-core/run.py) — otherwise unreachable from
    # assistant-backend, which runs in a Docker container. Lets that
    # container reach fazle-core's admin-only, closed-allowlist ops-flag
    # endpoints (backend/src/routes/fazleOps.js — 4 hermes_customer_*
    # flags only, nothing else) without exposing fazle-core more broadly.
    # Same allow/deny-scoped pattern as opencode-internal/hermes-internal
    # above — restricted to this host's own Docker networks, never the
    # public internet (this host's UFW is NOT default-deny, so an allow
    # list here is what actually provides the boundary, not firewall
    # rules). fazle-core's own auth (X-Internal-Key, checked inside
    # fazle-core, not by nginx here) is the second, independent layer.
    location /fazle-ops-internal/ {
        allow 172.25.0.0/16;
        allow 172.20.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8200/api/assistant/ops/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # ── Internal-only: Hermes Task/Approval state (2026-08-20) ──
    # Same pattern/rationale as fazle-ops-internal/ directly above — lets
    # assistant-backend's Docker container reach fazle-core's
    # modules.hermes_tasks routes (GET /api/tasks, GET /api/actions,
    # POST /api/actions/{id}/approve|reject — see
    # backend/src/routes/hermesTasks.js's own closed-set relay) for the
    # minimal Owner-facing task/approval panel, without exposing
    # fazle-core's full /api/ surface. fazle-core's own RBAC
    # (X-Internal-Key, checked inside fazle-core) is the second layer.
    location /hermes-tasks-internal/ {
        allow 172.25.0.0/16;
        allow 172.20.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8200/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assistant.iamazim.com;

    ssl_certificate /etc/letsencrypt/live/assistant.iamazim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistant.iamazim.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ── Hermes chat/relay (2026-08-14) — its own, longer proxy_read_timeout ──
    # More specific than /api/ below (nginx matches the longest prefix), so
    # only Hermes turns get the longer budget; every other /api/ route
    # (chat, settings, opencode, etc.) keeps the general block's 220s
    # unchanged. Must stay below the browser's REQUEST_TIMEOUT_MS (380s,
    # frontend api.js) and above assistant-backend's own fetch timeout to
    # hermes-runner (330s, hermes.js) — see hermes-runner/server.py's
    # timeout-chain comment and HANDOFF_P2_TIMEOUT_FIX_2026-08-14.md for
    # the full chain this is one link in.
    location /api/hermes/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 350s;
        client_max_body_size 50M;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 220s;
        client_max_body_size 50M;
    }

    # ── OmniRoute API (v1) — for client apps ──────────────
    # No Basic Auth: OpenAI-compatible clients send Bearer tokens, not Basic
    # Auth headers. Protected instead by OmniRoute's own REQUIRE_API_KEY
    # (enabled 2026-08-02 — confirmed: unauthenticated requests get 401).
    # More specific than /omniroute/ below, so it must come first.
    location /omniroute/v1/ {
        proxy_pass http://127.0.0.1:20128/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /omniroute/ {
        auth_basic "OmniRoute Admin";
        auth_basic_user_file /etc/nginx/.omniroute-auth;

        proxy_pass http://127.0.0.1:20128/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    client_max_body_size 50M;
}
